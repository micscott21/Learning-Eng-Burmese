<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#06231D">
<title>Learning English</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito+Sans:wght@400;600;800&family=Sora:wght@600;700;800&family=Noto+Sans+Myanmar:wght@400;600;700&display=swap">
<style>
html{color-scheme:dark}[hidden]{display:none!important}

/* Layout concept: fixed glass sidebar with a 3-level tree (course > unit > lesson) beside a calm reading column.
   Palette from the supplied gradients: #FFFDEE #E2FBCE #E3EF26 #076653 #0C342C #06231D. */
:root{
  --bg:#06231D; --bg2:#0A2D25; --surface:#0C342C; --glass:rgba(12,52,44,.66); --glass-strong:rgba(12,52,44,.92);
  --line:rgba(226,251,206,.14); --line-strong:rgba(226,251,206,.28);
  --fg:#FFFDEE; --muted:#A8C6B4; --accent:#E3EF26; --accent-ink:#06231D; --brand:#E3EF26; --mid:#076653; --soft:#E2FBCE;
  --good:#5EE6A0; --warn:#F3D250; --info:#86B8FF; --bad:#FF908A; --violet:#BBA8FF; --teal:#4FE0D2; --grey:#C9D1CB;
  --shadow:0 18px 50px rgba(0,0,0,.35); --focus:#E3EF26;
  --f-display:'Sora','Noto Sans Myanmar',system-ui,sans-serif;
  --f-body:'Nunito Sans','Noto Sans Myanmar',system-ui,sans-serif;
  --f-my:'Noto Sans Myanmar','Myanmar Text','Padauk',sans-serif;
  --t-xs:.78rem; --t-sm:.9rem; --t-base:1rem; --t-md:1.14rem; --t-lg:1.5rem; --t-xl:2.05rem; --t-2xl:clamp(2.1rem,5.2vw,3.3rem);
  --r-sm:10px; --r-md:16px; --r-lg:24px; --side:304px; --top:64px;
  color-scheme:dark;
}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#FFFDEE; --bg2:#F1F8DA; --surface:#FFFFFF; --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.96);
  --line:rgba(12,52,44,.13); --line-strong:rgba(12,52,44,.3); --fg:#0C342C; --muted:#4D6D61; --brand:#076653;
  --good:#0B8A55; --warn:#8A6A00; --info:#1C5FC4; --bad:#B3261E; --violet:#5B3FC9; --teal:#00796F; --grey:#4B5651;
  --shadow:0 14px 40px rgba(12,52,44,.14); --focus:#076653; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#FFFDEE; --bg2:#F1F8DA; --surface:#FFFFFF; --glass:rgba(255,255,255,.72); --glass-strong:rgba(255,255,255,.96);
  --line:rgba(12,52,44,.13); --line-strong:rgba(12,52,44,.3); --fg:#0C342C; --muted:#4D6D61; --brand:#076653;
  --good:#0B8A55; --warn:#8A6A00; --info:#1C5FC4; --bad:#B3261E; --violet:#5B3FC9; --teal:#00796F; --grey:#4B5651;
  --shadow:0 14px 40px rgba(12,52,44,.14); --focus:#076653; color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}

*{box-sizing:border-box}
html{font-size:17px;scroll-behavior:smooth}
html[data-size="s"]{font-size:15px}
html[data-size="l"]{font-size:19.5px}
body{margin:0;padding-block:0;padding-left:0;padding-right:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:var(--t-base);line-height:1.6;min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
:lang(my){font-family:var(--f-my);line-height:1.95;letter-spacing:0}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.25;margin:0;text-wrap:balance;font-weight:700}
h1:lang(my),h2:lang(my),h3:lang(my){line-height:1.7}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:6px}
svg.i{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
body.no-tr .tr{display:none!important}

/* ambient background */
.ambient{position:fixed;inset:0;z-index:0;pointer-events:none;background:
  radial-gradient(900px 500px at 85% -10%,rgba(7,102,83,.55),transparent 70%),
  radial-gradient(700px 500px at -10% 110%,rgba(227,239,38,.07),transparent 70%),var(--bg)}
:root[data-theme="light"] .ambient{background:radial-gradient(900px 500px at 90% -10%,rgba(226,251,206,.9),transparent 70%),radial-gradient(600px 400px at 0 100%,rgba(227,239,38,.18),transparent 70%),var(--bg)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) .ambient{background:radial-gradient(900px 500px at 90% -10%,rgba(226,251,206,.9),transparent 70%),radial-gradient(600px 400px at 0 100%,rgba(227,239,38,.18),transparent 70%),var(--bg)}}

/* ============ shell ============ */
.shell{position:relative;z-index:1;display:flex;min-height:100vh}
.side{position:fixed;inset:0 auto 0 0;width:var(--side);z-index:40;display:flex;flex-direction:column;
  background:var(--glass-strong);border-right:1px solid var(--line);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  transform:translateX(0);transition:transform .38s cubic-bezier(.22,1,.36,1);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.stage{flex:1;min-width:0;margin-left:var(--side);transition:margin-left .38s cubic-bezier(.22,1,.36,1)}
body.side-closed .side{transform:translateX(-102%)}
body.side-closed .stage{margin-left:0}
.scrim{position:fixed;inset:0;z-index:35;background:rgba(2,12,9,.6);opacity:0;pointer-events:none;transition:opacity .3s}
@media (max-width:900px){
  .stage{margin-left:0!important}
  .side{width:min(86vw,330px);transform:translateX(-102%);box-shadow:var(--shadow)}
  body.side-open .side{transform:translateX(0)}
  body.side-open .scrim{opacity:1;pointer-events:auto}
  body.side-closed .side{transform:translateX(-102%)}
}
.brand{display:flex;align-items:center;gap:.8rem;padding:1.1rem 1.1rem .9rem;text-decoration:none}
.brand svg{width:46px;height:46px;flex:none;filter:drop-shadow(0 4px 14px rgba(227,239,38,.35))}
.brand b{display:block;font-family:var(--f-display);font-size:1.08rem;letter-spacing:.01em}
.brand small{display:block;color:var(--muted);font-size:var(--t-xs)}
.side-scroll{flex:1;overflow-y:auto;padding:.2rem .8rem 1rem;scrollbar-width:thin}
.label{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin:1rem .4rem .45rem;font-weight:700}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:999px;background:var(--bg2);border:1px solid var(--line);position:relative}
.seg button{position:relative;z-index:1;border:0;background:none;padding:.55rem .6rem;border-radius:999px;font-weight:700;font-size:var(--t-sm);transition:color .25s;color:var(--muted)}
.seg button[aria-pressed="true"]{color:var(--accent-ink)}
.seg .thumb{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:999px;background:linear-gradient(135deg,var(--accent),#B9D32A);transition:transform .4s cubic-bezier(.22,1,.36,1);box-shadow:0 4px 14px rgba(227,239,38,.3)}
.seg[data-v="my"] .thumb{transform:translateX(100%)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:.8rem;width:100%;padding:.7rem .85rem;border-radius:var(--r-md);background:var(--bg2);border:1px solid var(--line);text-align:left}
.switch span.t{font-size:var(--t-sm);font-weight:700;line-height:1.35}
.switch span.t small{display:block;font-weight:500;color:var(--muted);font-size:var(--t-xs)}
.track{width:46px;height:26px;border-radius:999px;background:var(--line-strong);position:relative;transition:background .3s;flex:none}
.track::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:var(--fg);transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.switch[aria-checked="true"] .track{background:var(--mid)}
.switch[aria-checked="true"] .track::after{transform:translateX(20px);background:var(--accent)}

/* nav tree */
.nav{display:flex;flex-direction:column;gap:2px}
.nav a,.nav button.row{display:flex;align-items:center;gap:.6rem;width:100%;text-align:left;text-decoration:none;border:0;background:none;border-radius:12px;padding:.55rem .7rem;transition:background .2s,color .2s}
.nav a:hover,.nav button.row:hover{background:var(--line)}
.nav .l1{font-weight:800;font-family:var(--f-display);font-size:var(--t-sm)}
.nav .l2{font-weight:700;font-size:var(--t-sm);padding-left:.4rem}
.nav .l3{font-size:var(--t-sm);color:var(--muted);padding-left:.4rem}
.nav .sub{overflow:hidden;margin-left:1.05rem;padding-left:.55rem;border-left:1px dashed var(--line-strong)}
.nav .sub[hidden]{display:none}
.nav .chev{margin-left:auto;transition:transform .3s}
.nav .open>.row .chev{transform:rotate(90deg)}
.nav [aria-current="page"]{background:linear-gradient(90deg,rgba(227,239,38,.2),rgba(227,239,38,.04));color:var(--fg);box-shadow:inset 3px 0 0 var(--accent)}
.nav .dot{width:9px;height:9px;border-radius:50%;border:2px solid var(--line-strong);flex:none}
.nav .dot.doing{border-color:var(--teal);background:linear-gradient(90deg,var(--teal) 50%,transparent 50%)}
.nav .dot.done{border-color:var(--good);background:var(--good)}
.nav .ico{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(135deg,rgba(227,239,38,.22),rgba(7,102,83,.5));color:var(--accent)}
:root[data-theme="light"] .nav .ico{color:var(--brand)}
.side-foot{padding:.8rem 1rem 1rem;border-top:1px solid var(--line);font-size:var(--t-xs);color:var(--muted);display:flex;align-items:center;gap:.7rem}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;flex:1}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--mid),var(--accent));transition:width .8s cubic-bezier(.22,1,.36,1)}

/* topbar */
.topbar{position:sticky;top:0;z-index:30;height:calc(var(--top) + env(safe-area-inset-top,0px));padding-top:env(safe-area-inset-top,0px);display:flex;align-items:center;gap:.7rem;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}
.ibtn{width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--glass);display:grid;place-items:center;flex:none;transition:transform .2s,background .2s,border-color .2s;position:relative;overflow:hidden}
.ibtn:hover{background:var(--line);border-color:var(--line-strong)}
.ibtn:active{transform:scale(.94)}
.ibtn.txt{font-family:var(--f-display);font-weight:700;width:auto;padding:0 .8rem;gap:.4rem;display:inline-flex;align-items:center}
.crumbs{display:flex;align-items:center;gap:.35rem;min-width:0;flex:1;overflow:hidden;white-space:nowrap;font-size:var(--t-sm);color:var(--muted)}
.crumbs a,.crumbs span{overflow:hidden;text-overflow:ellipsis;text-decoration:none}
.crumbs a:hover{color:var(--fg)}
.crumbs [aria-current]{color:var(--fg);font-weight:700}
.crumbs .sep{opacity:.5;flex:none}
.pop{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top) + env(safe-area-inset-top,0px) - 4px);width:min(300px,calc(100vw - 32px));padding:1rem;border-radius:var(--r-md);background:var(--glass-strong);border:1px solid var(--line-strong);box-shadow:var(--shadow);backdrop-filter:blur(20px);z-index:50;
  transform-origin:top right;opacity:0;transform:scale(.92) translateY(-8px);pointer-events:none;transition:opacity .22s,transform .3s cubic-bezier(.34,1.56,.64,1)}
.pop.open{opacity:1;transform:none;pointer-events:auto}
.pop h4{font-size:var(--t-sm);margin-bottom:.6rem}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:1rem}
.opts button{padding:.55rem .3rem;border-radius:10px;border:1px solid var(--line);background:var(--bg2);font-weight:700}
.opts button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.opts .a1{font-size:.85rem}.opts .a2{font-size:1.05rem}.opts .a3{font-size:1.3rem}

/* ============ content ============ */
.page{padding-inline:max(16px,env(safe-area-inset-left,0px));padding-block:2rem 5rem;max-width:1040px;margin-inline:auto}
.page > section{animation:rise .5s cubic-bezier(.22,1,.36,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.stagger>*{animation:rise .5s cubic-bezier(.22,1,.36,1) both;animation-delay:calc(var(--i,0)*55ms)}
.eyebrow{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.14em;color:var(--brand);font-weight:800;margin-bottom:.5rem}
.h1{font-size:var(--t-2xl);margin-bottom:.4rem}
.h1-tr{font-size:var(--t-md);color:var(--muted);margin-bottom:1.2rem}
.lede{font-size:var(--t-md);color:var(--muted);max-width:62ch}

/* glass */
.glass{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* hero */
.hero{display:grid;grid-template-columns:1.25fr .75fr;gap:1.4rem;align-items:stretch;margin-bottom:2rem}
.hero-main{padding:clamp(1.3rem,3.5vw,2.4rem);position:relative;overflow:hidden;background:linear-gradient(145deg,#076653 0%,#0C342C 55%,#06231D 100%);border:1px solid rgba(227,239,38,.22);border-radius:var(--r-lg);color:#FFFDEE}
.hero-main::after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:radial-gradient(circle,rgba(227,239,38,.35),transparent 65%)}
.hero-main .lede{color:#CFE6D6;margin:.8rem 0 1.4rem;position:relative;z-index:1}.hero-main h1{padding-right:clamp(80px,10vw,120px)}
.hero-main h1{position:relative;z-index:1;color:#FFFDEE}
.hero-main .eyebrow{color:#E3EF26;position:relative;z-index:1}
.hero-main .btnrow{position:relative;z-index:1}
.hero-owl{position:absolute;right:1.2rem;top:1.1rem;width:clamp(72px,9vw,104px);opacity:.95;z-index:1;filter:drop-shadow(0 10px 24px rgba(0,0,0,.4));animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.stat{padding:1.3rem;display:flex;flex-direction:column;gap:1rem;justify-content:center}
.ring{--p:0;width:112px;height:112px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;transition:--p 1s;margin-inline:auto}
.ring div{width:86px;height:86px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.35rem}
.stat dl{display:grid;grid-template-columns:1fr auto;gap:.3rem .8rem;margin:0;font-size:var(--t-sm)}
.stat dt{color:var(--muted)}.stat dd{margin:0;font-weight:800;text-align:right;font-variant-numeric:tabular-nums}
@media (max-width:760px){.hero{grid-template-columns:1fr}.hero-owl{width:64px}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;padding:.8rem 1.35rem;border-radius:999px;border:0;font-weight:800;font-family:var(--f-display);font-size:var(--t-sm);position:relative;overflow:hidden;transition:transform .2s,box-shadow .25s;text-decoration:none}
.btn:active{transform:scale(.96)}
.btn.primary{background:linear-gradient(135deg,var(--accent),#A9C928);color:#06231D;box-shadow:0 8px 24px rgba(227,239,38,.28)}
.btn.primary:hover{box-shadow:0 10px 32px rgba(227,239,38,.45);transform:translateY(-1px)}
.btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--fg)}
.hero-main .btn.ghost{color:#FFFDEE}
.btn.ghost:hover{background:var(--line)}
.btnrow{display:flex;flex-wrap:wrap;gap:.7rem}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.45);transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(4);opacity:0}}

/* pills (glossy status pills) */
.pill{--c:var(--grey);display:inline-flex;align-items:center;gap:.4rem;padding:.2rem .7rem .2rem .5rem;border-radius:999px;font-size:var(--t-xs);font-weight:800;white-space:nowrap;
  color:var(--c);background:linear-gradient(135deg,color-mix(in srgb,var(--c) 26%,transparent),color-mix(in srgb,var(--c) 7%,transparent));border:1px solid color-mix(in srgb,var(--c) 65%,transparent);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.pill i{width:.62rem;height:.62rem;border-radius:50%;background:var(--c);display:block}
.pill.doing{--c:var(--teal)}.pill.done{--c:var(--good)}.pill.todo{--c:var(--violet)}
.pill.beg{--c:var(--good)}.pill.int{--c:var(--warn)}.pill.adv{--c:var(--bad)}
.pill.type{--c:var(--info)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,290px),1fr));gap:1rem}
.card{display:flex;flex-direction:column;gap:.7rem;padding:1.25rem;text-decoration:none;position:relative;overflow:hidden;transition:transform .3s cubic-bezier(.22,1,.36,1),border-color .25s,box-shadow .3s}
.card:hover{transform:translateY(-4px);border-color:var(--accent);box-shadow:var(--shadow)}
.card h3{font-size:var(--t-md)}
.card .sub{color:var(--muted);font-size:var(--t-sm)}
.card .meta{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;margin-top:auto;padding-top:.4rem;font-size:var(--t-xs);color:var(--muted)}
.card .ico{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--accent),#7FB82B);color:#06231D}
.card .ico svg{width:24px;height:24px}
.card .go{position:absolute;right:1.1rem;top:1.2rem;opacity:.5;transition:transform .3s,opacity .3s}
.card:hover .go{transform:translateX(4px);opacity:1;color:var(--accent)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:1rem;margin:2.2rem 0 1rem}
.section-h h2{font-size:var(--t-lg)}

/* 3-level explainer */
.levels{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
@media (max-width:700px){.levels{grid-template-columns:1fr}}
.lv{padding:1.1rem 1.2rem;display:flex;gap:.9rem;align-items:flex-start}
.lv b.n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);font-family:var(--f-display);flex:none}
.lv h3{font-size:var(--t-base);margin-bottom:.15rem}.lv p{font-size:var(--t-sm);color:var(--muted)}

/* lesson rows */
.rows{display:flex;flex-direction:column;gap:.7rem}
.lrow{display:flex;align-items:center;gap:1rem;padding:1rem 1.2rem;text-decoration:none;transition:transform .25s,border-color .25s,background .25s}
.lrow:hover{transform:translateX(4px);border-color:var(--accent);background:var(--glass-strong)}
.lrow .no{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--bg2);border:1px solid var(--line);flex:none;font-variant-numeric:tabular-nums}
.lrow .tx{flex:1;min-width:0}.lrow .tx h3{font-size:var(--t-base)}
.lrow .tx p{font-size:var(--t-sm);color:var(--muted)}
.lrow .end{display:flex;gap:.5rem;align-items:center;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.lrow{flex-wrap:wrap}.lrow .end{width:100%;justify-content:flex-start;padding-left:58px}}

/* lesson */
.lhead{margin-bottom:1.6rem}
.lhead .tags{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.9rem}
.block{padding:1.2rem 1.35rem;margin-bottom:1rem}
.block h3{font-size:var(--t-md);margin-bottom:.8rem;display:flex;align-items:center;gap:.6rem}
.point{display:flex;gap:.9rem;padding:1rem 1.2rem;margin-bottom:.8rem;align-items:flex-start}
.point .k{width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:var(--t-sm);flex:none;font-family:var(--f-display)}
.point .main{font-size:var(--t-md);line-height:1.6;max-width:68ch}
.point .main:lang(my){line-height:1.95}
.tr{color:var(--muted);font-size:var(--t-sm);margin-top:.35rem;line-height:1.75;max-width:68ch}
.tablewrap{overflow-x:auto;border-radius:var(--r-md);border:1px solid var(--line);background:var(--glass)}
table{width:100%;border-collapse:collapse;font-size:var(--t-sm)}
th,td{padding:.7rem 1rem;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.08em;color:var(--brand);background:rgba(7,102,83,.22);white-space:nowrap}
tr:last-child td{border-bottom:0}
td:first-child{font-weight:700}
td.tr{margin:0;max-width:none;font-size:var(--t-sm);color:var(--muted)}
th.tr{margin:0;max-width:none;font-size:var(--t-xs);color:var(--brand);line-height:inherit}
.ex{display:flex;gap:.8rem;align-items:flex-start;padding:.85rem 0;border-bottom:1px dashed var(--line)}
.ex:last-child{border-bottom:0}
.ex .main{font-size:var(--t-md);flex:1;min-width:0}
.ex .tr{margin-top:.15rem}
.spk{width:38px;height:38px;border-radius:50%;border:1px solid var(--line-strong);background:var(--bg2);display:grid;place-items:center;flex:none;transition:transform .2s,background .2s;color:var(--brand)}
.spk:hover{background:var(--accent);color:var(--accent-ink);transform:scale(1.08)}
.spk.on{background:var(--accent);color:var(--accent-ink);animation:pulse .8s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(227,239,38,.2)}}

/* vocab */
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,310px),1fr));gap:1rem}
.word{padding:1.15rem 1.2rem;display:flex;flex-direction:column;gap:.45rem;transition:transform .25s,border-color .25s}
.word:hover{border-color:var(--line-strong);transform:translateY(-3px)}
.word .top{display:flex;align-items:center;gap:.6rem}
.word h3{font-size:var(--t-lg);flex:1;letter-spacing:-.01em}
.word .pos{font-size:var(--t-xs);color:var(--muted);font-style:italic}
.word .mm{font-size:var(--t-md);color:var(--brand);font-weight:700;margin:0}
.word .def{font-size:var(--t-sm)}
.word .eg{font-size:var(--t-sm);border-left:3px solid var(--accent);padding-left:.8rem;margin-top:.3rem}
.word .eg .tr{margin-top:.1rem}

/* sentences */
.sent{display:flex;gap:.9rem;align-items:flex-start;padding:1rem 1.2rem;margin-bottom:.7rem}
.sent .no{font-family:var(--f-display);font-weight:800;color:var(--brand);min-width:1.6rem;font-variant-numeric:tabular-nums}
.sent .main{font-size:var(--t-md);flex:1;min-width:0}
.peek{border:1px dashed var(--line-strong);background:none;border-radius:999px;padding:.2rem .8rem;font-size:var(--t-xs);color:var(--muted);margin-top:.4rem}
body:not(.no-tr) .peek{display:none}
.peek[aria-expanded="true"]{display:none}

/* scramble */
.scr{padding:1.2rem 1.35rem;margin-bottom:1rem}
.scr .tgt{min-height:3.6rem;display:flex;flex-wrap:wrap;gap:.5rem;padding:.8rem;border-radius:var(--r-md);border:2px dashed var(--line-strong);margin:.7rem 0;align-content:flex-start;transition:border-color .25s,background .25s}
.scr .tgt.ok{border-color:var(--good);background:color-mix(in srgb,var(--good) 12%,transparent)}
.scr .tgt.bad{border-color:var(--bad);animation:shake .4s}
.scr .bank{display:flex;flex-wrap:wrap;gap:.5rem;min-height:2.6rem}
.tok{padding:.45rem .9rem;border-radius:999px;border:1px solid var(--line-strong);background:var(--bg2);font-weight:700;font-size:var(--t-sm);transition:transform .2s,background .2s;animation:pop .3s cubic-bezier(.34,1.56,.64,1)}
.tok:hover{background:var(--accent);color:var(--accent-ink);transform:translateY(-2px)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}

/* letters */
.groups{display:flex;flex-direction:column;gap:1rem}
.lgroup h4{font-size:var(--t-sm);color:var(--brand);margin-bottom:.5rem}
.tiles{display:flex;flex-wrap:wrap;gap:.6rem}
.tile{width:72px;height:72px;border-radius:18px;border:1px solid var(--line-strong);background:var(--glass);font-family:var(--f-my);font-size:2rem;display:grid;place-items:center;line-height:1;transition:transform .25s cubic-bezier(.34,1.56,.64,1),background .2s}
.tile:hover{transform:translateY(-4px) rotate(-3deg);background:var(--bg2)}
.tile[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);transform:scale(1.08)}
.detail{position:sticky;top:calc(var(--top) + 8px);z-index:5;display:flex;align-items:center;gap:1.2rem;padding:1rem 1.3rem;margin-bottom:1.2rem;background:var(--glass-strong)}
.detail .big{font-family:var(--f-my);font-size:3.6rem;line-height:1.2;width:84px;text-align:center;color:var(--brand);flex:none}
.detail b{font-family:var(--f-display);font-size:var(--t-lg)}
.detail p{color:var(--muted);font-size:var(--t-sm)}

/* quiz */
.quiz{margin-top:2rem}
.quiz>h2{font-size:var(--t-lg);margin-bottom:1rem;display:flex;align-items:center;gap:.7rem}
.q{padding:1.2rem 1.35rem;margin-bottom:.9rem}
.q .qt{font-size:var(--t-md);font-weight:700;margin-bottom:.9rem;display:flex;gap:.7rem}
.q .qt .n{color:var(--brand);font-family:var(--f-display)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:.6rem}
.choice{text-align:left;padding:.75rem 1rem;border-radius:var(--r-md);border:1px solid var(--line-strong);background:var(--bg2);font-size:var(--t-base);transition:transform .2s,border-color .2s,background .2s;position:relative;overflow:hidden}
.choice:hover:not(:disabled){border-color:var(--accent);transform:translateY(-2px)}
.choice:disabled{cursor:default}
.choice.right{border-color:var(--good);background:color-mix(in srgb,var(--good) 18%,transparent);animation:pop .4s cubic-bezier(.34,1.56,.64,1)}
.choice.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 16%,transparent);animation:shake .4s}
.why{margin-top:.8rem;padding:.7rem .9rem;border-radius:var(--r-sm);background:var(--bg2);font-size:var(--t-sm);animation:rise .3s both}
.score{padding:1.3rem 1.4rem;display:flex;align-items:center;gap:1.1rem;flex-wrap:wrap;animation:rise .5s both;border-color:var(--accent)}
.score b{font-family:var(--f-display);font-size:var(--t-xl)}
.pager{display:flex;justify-content:space-between;gap:.8rem;flex-wrap:wrap;margin-top:2.4rem;padding-top:1.4rem;border-top:1px solid var(--line)}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;z-index:90;padding:.8rem 1.3rem;border-radius:999px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-family:var(--f-display);font-size:var(--t-sm);box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.34,1.56,.64,1),opacity .25s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.show{transform:translate(-50%,0);opacity:1}

/* welcome overlay */
.welcome{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:16px;overflow:hidden;
  background:linear-gradient(180deg,#0f4a3d 0%,#2a7a52 38%,#b7c94a 62%,#E3EF26 100%);transition:opacity .6s,visibility .6s}
.welcome::before,.welcome::after{content:"";position:absolute;left:-10%;right:-10%;border-radius:50% 50% 0 0/100% 100% 0 0}
.welcome::before{bottom:-12vh;height:46vh;background:linear-gradient(180deg,#2e8a4f,#076653)}
.welcome::after{bottom:-22vh;height:44vh;background:linear-gradient(180deg,#076653,#0C342C);left:-30%;right:20%}
.welcome.out{opacity:0;visibility:hidden}
.welcome.out .wcard{transform:translateY(-30px) scale(.94)}
.wcard{position:relative;z-index:2;width:min(400px,100%);padding:2rem 1.7rem 1.6rem;border-radius:28px;color:#FFFDEE;background:linear-gradient(160deg,rgba(255,255,255,.24),rgba(12,52,44,.55));border:1.5px solid rgba(255,255,255,.55);backdrop-filter:blur(22px) saturate(1.2);-webkit-backdrop-filter:blur(22px) saturate(1.2);box-shadow:0 30px 80px rgba(0,0,0,.35);transition:transform .6s cubic-bezier(.22,1,.36,1);animation:rise .8s cubic-bezier(.22,1,.36,1) both}
.wcard .logo{width:78px;height:78px;margin:0 auto .8rem;display:block;animation:float 4.5s ease-in-out infinite}
.wcard h1{font-size:1.7rem;text-align:center}
.wcard p{text-align:center;margin:.4rem 0 1.4rem;color:#FFFDEE;opacity:.92;font-size:var(--t-sm)}
.wcard label{display:block;font-size:var(--t-sm);font-weight:700;margin-bottom:.4rem}
.wcard input{width:100%;padding:.85rem 1.1rem;border-radius:16px;border:1.5px solid rgba(255,255,255,.7);background:rgba(255,255,255,.12);color:#FFFDEE;font:inherit;font-size:var(--t-base)}
.wcard input::placeholder{color:rgba(255,253,238,.7)}
.wcard input:focus{outline:3px solid #E3EF26;outline-offset:2px}
.wcard .btn{width:100%;margin-top:1.1rem;padding:.95rem;font-size:var(--t-base);background:linear-gradient(90deg,#B9C922,#1E9F5A);color:#fff}
.wcard .skip{display:block;width:100%;background:none;border:0;margin-top:.7rem;color:#FFFDEE;opacity:.85;font-size:var(--t-sm);text-decoration:underline}
.wlang{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;margin-top:1rem}
.wlang button{padding:.65rem;border-radius:14px;border:1.5px solid rgba(255,255,255,.55);background:rgba(255,255,255,.1);color:#FFFDEE;font-weight:800}
.wlang button[aria-pressed="true"]{background:#E3EF26;color:#06231D;border-color:#E3EF26}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
@media print{.side,.topbar{display:none}.stage{margin:0}}

</style>

{id:'g1-2',type:'grammar',title:['Singular and plural','တစ်ခုတည်းနှင့် အများကိန်း'],
 points:[
 [['Most nouns add -s to make the plural: bottle → bottles.','နာမ်အများစုက -s ထည့်ပြီး အများကိန်းဖြစ်တယ်: bottle → bottles။']],
 [['Add -es after s, x, ch, sh: box → boxes, watch → watches. After a consonant + y, change y to -ies: story → stories.','s, x, ch, sh နောက်မှာ -es ထည့်တယ်: box → boxes။ ဗျည်း + y ဆိုရင် y ကို -ies ပြောင်းတယ်: story → stories။']],
 [['Some nouns are irregular and must be learned by heart.','တချို့နာမ်တွေက ပုံမှန်မဟုတ်လို့ အလွတ်ကျက်ရပါမယ်။']]],
 table:{head:['Singular','Plural','Rule'],rows:[['book','books','+s'],['box','boxes','+es'],['city','cities','y → ies'],['child','children','irregular'],['man','men','irregular'],['foot','feet','irregular'],['sheep','sheep','same form']]},
 examples:[['Two children ran across the lawn.','ကလေးနှစ်ယောက်က မြက်ခင်းပေါ်ကို ပြေးဖြတ်သွားတယ်။'],['She keeps three boxes in the attic.','သူမက ခေါင်မိုးအောက်ခန်းထဲမှာ သေတ္တာသုံးလုံး သိမ်းထားတယ်။']],
 quiz:[Q('Plural of "city"?',['citys','cities','cityes','citis'],1),Q('Plural of "foot"?',['foots','feets','feet','foot'],2),Q('Plural of "watch"?',['watchs','watches','watchies','watch'],1),Q('Which is already plural?',['sheep','sheeps','mans','childs'],0,['"Sheep" has the same singular and plural form.','"Sheep" ရဲ့ တစ်ခုတည်းနဲ့ အများကိန်း ပုံစံတူတယ်။'])]},
{id:'g1-3',type:'grammar',title:['Articles: a, an, the','Articles: a, an, the'],
 points:[
 [['Use "a" before a consonant sound and "an" before a vowel sound: a bottle, an attic.','ဗျည်းအသံရှေ့မှာ "a"၊ သရအသံရှေ့မှာ "an" သုံးတယ်: a bottle, an attic။']],
 [['Sound matters, not spelling: an hour (silent h), a university (starts with "yoo").','စာလုံးပေါင်းထက် အသံက အရေးကြီးတယ်: an hour (h မမြည်), a university ("yoo" နဲ့စ)။']],
 [['Use "the" when both speaker and listener know which one: Close the door.','နားထောင်သူကလည်း ဘယ်တစ်ခုလဲ သိနေရင် "the" သုံးတယ်: Close the door။']]],
 table:{head:['Article','Use','Example'],rows:[['a','one, not specific, consonant sound','a lemon'],['an','one, not specific, vowel sound','an apple'],['the','specific, known to both','the lemon on the table']]},

 quiz:[Q('___ umbrella',['a','an','the','—'],1),Q('___ hour',['a','an','—','one'],1),Q('I saw ___ owl. ___ owl was huge. (first mention / second mention)',['an / The','the / An','a / A','an / An'],0),Q('___ university',['an','a','the an','—'],1)]}
]},
{id:'g2',title:['Pronouns and the Verb "be"','နာမ်စားနှင့် "be" ကြိယာ'],lessons:[
{id:'g2-1',type:'grammar',title:['Subject and object pronouns','Subject နှင့် Object နာမ်စား'],
 points:[
 [['A pronoun takes the place of a noun so we do not repeat it.','နာမ်စားက နာမ်နေရာမှာ အစားထိုးသုံးတာမို့ နာမ်ကို ထပ်ခါထပ်ခါ မပြောရတော့ဘူး။']],
 [['Subject pronouns come before the verb: She smiled. Object pronouns come after the verb or a preposition: Tom called her.','Subject pronoun က ကြိယာရှေ့မှာ လာတယ်: She smiled။ Object pronoun က ကြိယာ/ဝိဘတ်နောက်မှာ လာတယ်: Tom called her။']]],
 table:{head:['Subject','Object','မြန်မာ'],rows:[['I','me','ကျွန်တော်/ကျွန်မ'],['you','you','မင်း/ခင်ဗျား'],['he','him','သူ (ယောက်ျား)'],['she','her','သူမ'],['it','it','၎င်း (အရာဝတ္ထု)'],['we','us','ကျွန်တော်တို့'],['they','them','သူတို့']]},
 examples:[['We walked home, and they followed us.','ကျွန်တော်တို့ အိမ်ကို လမ်းလျှောက်ပြန်ပြီး သူတို့က ကျွန်တော်တို့ကို လိုက်လာတယ်။'],['Grandma gave him a bottle.','အဖွားက သူ့ကို ပုလင်းတစ်လုံး ပေးတယ်။']],

{id:'g2-2',type:'grammar',title:['Possessives','ပိုင်ဆိုင်မှု စကားလုံးများ'],
 points:[
 [['Possessive adjectives go before a noun: my book. Possessive pronouns stand alone: The book is mine.','Possessive adjective က နာမ်ရှေ့မှာ လာတယ်: my book။ Possessive pronoun က တစ်ခုတည်း သုံးနိုင်တယ်: The book is mine။']],
 [["For nouns add 's: Tom's bicycle. For plural nouns ending in s add only an apostrophe: the boys' room.","နာမ်ဆိုရင် 's ထည့်တယ်: Tom's bicycle။ s နဲ့ဆုံးတဲ့ အများကိန်းဆိုရင် ' ပဲ ထည့်တယ်: the boys' room။"]]],
 table:{head:['Pronoun','Adjective','Pronoun (alone)'],rows:[['I','my','mine'],['you','your','yours'],['he','his','his'],['she','her','hers'],['we','our','ours'],['they','their','theirs']]},

 quiz:[Q('That coat is ___. (belongs to me)',['my','mine','me','I'],1),Q('She lost ___ keys.',['her','hers','she','herself'],0),Q('The ___ toys are on the floor. (several children)',["children's","childrens'","childrens","child's"],0),Q('Is this pen ___? (belongs to you)',['your','yours','you','yourself'],1)]},
{id:'g2-3',type:'grammar',title:['am, is, are, was, were','am, is, are, was, were'],
 points:[
 [['"Be" links a subject to a description, a place or an identity.','"Be" က subject ကို ဖော်ပြချက်၊ နေရာ၊ အမည်နဲ့ ချိတ်ဆက်ပေးတယ်။']],
 [['Present: I am, he/she/it is, you/we/they are. Past: I/he/she/it was, you/we/they were.','ပစ္စုပ္ပန်: I am, he/she/it is, you/we/they are။ အတိတ်: I/he/she/it was, you/we/they were။']],
 [['Questions swap the order: Is she at home? Negatives add not: She is not (isn\'t) at home.','မေးခွန်းမှာ နေရာလဲတယ်: Is she at home? ငြင်းဆိုရင် not ထည့်တယ်: She is not (isn\'t) at home။']]],
 table:{head:['Subject','Present','Past'],rows:[['I','am','was'],['he / she / it','is','was'],['you / we / they','are','were']]},

]},
{id:'g3',title:['Verbs and Tenses','ကြိယာနှင့် Tenses'],lessons:[
{id:'g3-1',type:'grammar',title:['Present simple','Present Simple'],
 points:[
 [['Use the present simple for habits, facts and routines.','အလေ့အထ၊ အမှန်တရားနဲ့ နေ့စဉ်လုပ်ရိုးလုပ်စဉ်တွေအတွက် Present Simple သုံးတယ်။']],
 [['With he, she and it, add -s or -es to the verb: she walks, he watches.','he, she, it နဲ့ဆိုရင် ကြိယာမှာ -s သို့ -es ထည့်တယ်: she walks, he watches။']],
 [['Frequency words: always, usually, often, sometimes, never.','အကြိမ်ရေပြစကားလုံးတွေ: always, usually, often, sometimes, never။']]],
 table:{head:['Form','Example'],rows:[['I / you / we / they + verb','They walk to school.'],['he / she / it + verb-s','She walks to school.'],['Negative: do not / does not','He does not walk.'],['Question: Do / Does ... ?','Does she walk?']]},
 examples:[['Grandpa always sits on the porch after dinner.','အဖိုးက ညစာစားပြီးရင် ဝရန်တာမှာ အမြဲထိုင်တယ်။'],['The sun rises in the east.','နေက အရှေ့ကထွက်တယ်။']],

{id:'g3-2',type:'grammar',title:['Present continuous','Present Continuous'],
 points:[
 [['Use it for actions happening now or around now: be + verb-ing.','အခု ဖြစ်နေတဲ့ လုပ်ရပ်တွေအတွက် သုံးတယ်: be + verb-ing။']],
 [['Spelling: run → running (double the consonant), make → making (drop e).','စာလုံးပေါင်း: run → running (ဗျည်းထပ်), make → making (e ဖြုတ်)။']],
 [['Do not use it for states like know, like, want: write "I know", not "I am knowing".','know, like, want လို အခြေအနေကြိယာတွေနဲ့ မသုံးဘူး: "I know" လို့ပဲ ရေးပါ။']]],
 table:{head:['Subject','be','Verb-ing'],rows:[['I','am','reading'],['he / she / it','is','reading'],['we / you / they','are','reading']]},

 points:[
 [['Use the past simple for finished actions at a known time.','အတိတ်မှာ ပြီးဆုံးသွားတဲ့ လုပ်ရပ်တွေအတွက် သုံးတယ်။']],
 [['Regular verbs add -ed: walk → walked. Irregular verbs change form: go → went, see → saw.','ပုံမှန်ကြိယာက -ed ထည့်တယ်: walk → walked။ ပုံမမှန်ကြိယာက ပုံစံပြောင်းတယ်: go → went, see → saw။']],
 [['Negatives and questions use did + base verb: She did not go. Did she go?','ငြင်းဆိုခြင်းနဲ့ မေးခွန်းမှာ did + ကြိယာမူလပုံစံ သုံးတယ်: She did not go. Did she go?']]],

{id:'g3-4',type:'grammar',title:['Future: will and going to','အနာဂတ်: will နှင့် going to'],
 points:[
 [['"Will" is used for quick decisions, promises and predictions: I will help you.','"Will" က ချက်ချင်းဆုံးဖြတ်ချက်၊ ကတိနဲ့ ခန့်မှန်းချက်တွေမှာ သုံးတယ်: I will help you။']],
 [['"Be going to" is used for plans made before speaking: We are going to visit Grandma.','"Be going to" က စကားမပြောခင် စီစဉ်ထားပြီးသား အစီအစဉ်တွေမှာ သုံးတယ်: We are going to visit Grandma။']],
 [['After "will" always use the base verb: She will come, not "She will comes".','"will" နောက်မှာ ကြိယာမူလပုံစံ အမြဲသုံးတယ်: She will come။']]],

 examples:[['It is cloudy. It will probably rain.','မိုးတိမ်ထူနေတယ်။ မိုးရွာဖို့များတယ်။'],['We are going to bake bread tomorrow.','မနက်ဖြန် ကျွန်တော်တို့ ပေါင်မုန့်ဖုတ်မယ်။']],

]},
{id:'g4',title:['Adjectives and Adverbs','နာမဝိသေသနနှင့် ကြိယာဝိသေသန'],lessons:[
{id:'g4-1',type:'grammar',title:['Adjectives','Adjectives'],
 points:[
 [['An adjective describes a noun. It goes before the noun or after "be": a gentle breeze, The breeze is gentle.','Adjective က နာမ်ကို ဖော်ပြတယ်။ နာမ်ရှေ့မှာ ဒါမှမဟုတ် "be" နောက်မှာ လာတယ်: a gentle breeze။']],
 [['Adjectives have no plural form: two old men, not "two olds men".','Adjective မှာ အများကိန်းမရှိဘူး: two old men။']],
 [['Order: opinion, size, age, colour, material, noun: a lovely small old brown wooden chair.','အစီအစဉ်: အမြင်၊ အရွယ်၊ အသက်၊ အရောင်၊ ပစ္စည်း၊ နာမ်။']]],
 table:{head:['Order','Example'],rows:[['opinion','lovely'],['size','small'],['age','old'],['colour','brown'],['material','wooden'],['noun','chair']]},
 examples:[['She wore a beautiful red dress.','သူမက လှပတဲ့ အနီရောင်ဝတ်ရုံ ဝတ်ထားတယ်။'],['The old clock was silent.','ဟောင်းနွမ်းတဲ့ နာရီက တိတ်ဆိတ်နေတယ်။']],
 quiz:[Q('Which sentence is correct?',['a car red big','a big red car','a red big car','car a big red'],1),Q('Pick the adjective: "A cold wind blew."',['wind','cold','blew','A'],1),Q('Two ___ boys',['tall','talls','tallest','taller'],0),Q('The soup is ___ .',['delicious','deliciously','deliciousness','delicate'],0)]},
{id:'g4-2',type:'grammar',title:['Comparatives and superlatives','နှိုင်းယှဉ်ခြင်း'],
 points:[
 [['Short adjectives: add -er and -est: tall → taller → the tallest.','စာလုံးတို adjective: -er, -est ထည့်: tall → taller → the tallest။']],
 [['Long adjectives: use more and most: beautiful → more beautiful → the most beautiful.','စာလုံးရှည် adjective: more, most သုံး: beautiful → more beautiful → the most beautiful။']],
 [['Use "than" to compare two things: Mia is taller than Sam.','နှစ်ခု နှိုင်းယှဉ်ရင် "than" သုံးတယ်: Mia is taller than Sam။']]],

{id:'m3-2',type:'grammar',title:['Pronouns (နာမ်စား)','နာမ်စား'],
 points:[
 [['A pronoun (နာမ်စား) stands in place of a noun. Burmese pronouns change by speaker’s gender, age and politeness.','နာမ်စားက နာမ်အစား သုံးတဲ့ ပုဒ်ပါ။ မြန်မာနာမ်စားတွေက ပြောသူရဲ့ ကျား/မ၊ အသက်၊ ယဉ်ကျေးမှုအလိုက် ပြောင်းလဲတယ်။']],
 [['First person (ပထမပုဂ္ဂိုလ်) = the speaker: ကျွန်တော် (male), ကျွန်မ (female), ငါ (informal).','ပထမပုဂ္ဂိုလ် = ပြောသူ: ကျွန်တော် (ကျား)၊ ကျွန်မ (မ)၊ ငါ (ရင်းနှီး)။']],
 [['Second person (ဒုတိယပုဂ္ဂိုလ်) = the listener: ခင်ဗျား, ရှင်, မင်း. Third person (တတိယပုဂ္ဂိုလ်) = someone else: သူ, သူမ, သူတို့။','ဒုတိယပုဂ္ဂိုလ် = ကြားသူ: ခင်ဗျား၊ ရှင်၊ မင်း။ တတိယပုဂ္ဂိုလ် = အခြားသူ: သူ၊ သူမ၊ သူတို့။']]],
 table:{head:['Person','Burmese','English'],rows:[['1st','ကျွန်တော် / ကျွန်မ / ငါ','I'],['1st plural','ကျွန်တော်တို့ / ကျွန်မတို့ / ငါတို့','we'],['2nd','ခင်ဗျား / ရှင် / မင်း','you'],['2nd plural','ခင်ဗျားတို့ / မင်းတို့','you (pl.)'],['3rd','သူ / သူမ','he / she'],['3rd plural','သူတို့','they']]},
 examples:[['ကျွန်တော် စာဖတ်နေတယ်။ (I am reading.)','ကျွန်တော် စာဖတ်နေတယ်။'],['သူတို့ ကျောင်းသွားကြတယ်။ (They go to school.)','သူတို့ ကျောင်းသွားကြတယ်။']],
 quiz:[QM('ကျားလေးက ယဉ်ကျေးစွာ "ကျွန်တော်" ဟု ဆိုသည်။ ဒါဟာ ...',['ပထမပုဂ္ဂိုလ်','ဒုတိယပုဂ္ဂိုလ်','တတိယပုဂ္ဂိုလ်','အာမေဍိတ်'],0),QM('"မင်း" က ...',['ပထမပုဂ္ဂိုလ်','ဒုတိယပုဂ္ဂိုလ်','တတိယပုဂ္ဂိုလ်','ဝိဘတ်'],1),QM('"သူတို့" ရဲ့ အင်္ဂလိပ်လို ...',['we','you','they','I'],2),QM('"ကျွန်မ" ကို ဘယ်သူသုံးလဲ။',['အမျိုးသမီး','အမျိုးသား','လူတိုင်း','ကလေးသာ'],0)]}
]},
{id:'m4',title:['Verbs and Describing Words','ကြိယာနှင့် ဝိသေသန'],lessons:[
{id:'m4-1',type:'grammar',title:['Verbs (ကြိယာ)','ကြိယာ'],
 points:[
 [['A verb (ကြိယာ) tells what someone does or what happens: စား၊ သွား၊ ဖတ်၊ အိပ်။','ကြိယာက တစ်ယောက်လုပ်တာ၊ ဖြစ်တာကို ပြောတဲ့ ပုဒ်ပါ: စား၊ သွား၊ ဖတ်၊ အိပ်။']],
 [['Burmese verbs do not change form. Time and mood are shown by endings: တယ် (present/general), ခဲ့တယ် (past), မယ် (future), နေတယ် (continuous).','မြန်မာကြိယာက ပုံမပြောင်းဘူး။ အချိန်ကို နောက်ဆက်တွေနဲ့ ပြတယ်: တယ် (ပစ္စုပ္ပန်)၊ ခဲ့တယ် (အတိတ်)၊ မယ် (အနာဂတ်)၊ နေတယ် (ဆက်လက်)။']],
 [['Negative: put မ before the verb and ဘူး after: မစားဘူး။','ငြင်းဆိုခြင်း: ကြိယာရှေ့ မ၊ နောက် ဘူး ထည့်: မစားဘူး။']]],
 table:{head:['Meaning','Burmese','English'],rows:[['Present','စားတယ်','eat(s)'],['Past','စားခဲ့တယ်','ate'],['Future','စားမယ်','will eat'],['Continuous','စားနေတယ်','is eating'],['Negative','မစားဘူး','does not eat'],['Question','စားသလား','does (he) eat?']]},
 examples:[['ကျွန်တော် မနေ့က ဆရာဆီ သွားခဲ့တယ်။ (I went to the teacher yesterday.)','ကျွန်တော် မနေ့က ဆရာဆီ သွားခဲ့တယ်။'],['မနက်ဖြန် မိုးရွာမယ်။ (It will rain tomorrow.)','မနက်ဖြန် မိုးရွာမယ်။']],
 quiz:[QM('"စားခဲ့တယ်" က ဘယ်အချိန်လဲ။',['အတိတ်','ပစ္စုပ္ပန်','အနာဂတ်','ဆက်လက်'],0),QM('"သွားမယ်" က ...',['အတိတ်','အနာဂတ်','ငြင်းဆို','မေးခွန်း'],1),QM('"မ... ဘူး" ပုံစံက ဘာကို ပြလဲ။',['အတိတ်','အမိန့်','ငြင်းဆိုခြင်း','မေးခွန်း'],2),QM('"စာဖတ်နေတယ်" က ...',['ဆက်လက်ဖြစ်နေသည်','ပြီးသွားပြီ','မလုပ်ဘူး','လုပ်ဖို့စီစဉ်'],0)]},
{id:'m4-2',type:'grammar',title:['Adjectives (နာမဝိသေသန)','နာမဝိသေသန'],
 points:[
 [['An adjective (နာမဝိသေသန) describes a noun. In Burmese it usually comes after the noun and is joined with the particle သော / တဲ့: လှသောပန်း / လှတဲ့ပန်း။','နာမဝိသေသနက နာမ်ကို ဖော်ပြတယ်။ မြန်မာမှာ နာမ်ရဲ့ရှေ့မှာ လာပြီး သော / တဲ့ နဲ့ ချိတ်ပါတယ်: လှတဲ့ပန်း။']],
 [['Common groups: colour (အနီ၊ အစိမ်း), size (ကြီး၊ သေး), quality (ကောင်း၊ ဆိုး), number (နှစ်၊ သုံး).','အုပ်စုများ: အရောင်၊ အရွယ်၊ အရည်အသွေး၊ ဂဏန်း။']]],
 table:{head:['Burmese','English'],rows:[['ကြီးသော အိမ်','a big house'],['သေးတဲ့ ခွေး','a small dog'],['လှသော ပန်း','a beautiful flower'],['အစိမ်းရောင် သစ်ရွက်','a green leaf'],['ဟောင်းတဲ့ နာရီ','an old clock']]},
 examples:[['လှသောပန်းတစ်ပွင့် ပွင့်နေသည်။ (A beautiful flower is blooming.)','လှသောပန်းတစ်ပွင့် ပွင့်နေသည်။'],['ဟောင်းတဲ့ နာရီက အချိန်မှန်တယ်။ (The old clock keeps good time.)','ဟောင်းတဲ့ နာရီက အချိန်မှန်တယ်။']],
 quiz:[QM('"ကြီးသောအိမ်" ထဲမှာ နာမဝိသေသနက ...',['အိမ်','ကြီး','သော','—'],1),QM('နာမဝိသေသနက ဘာကို ဖော်ပြလဲ။',['ကြိယာ','နာမ်','ဝိဘတ်','အာမေဍိတ်'],1),QM('"အစိမ်းရောင်" က ဘာအုပ်စုလဲ။',['အရွယ်','အရောင်','ဂဏန်း','အရသာ'],1),QM('"လှတဲ့ ပန်း" ထဲက "တဲ့" က ...',['ချိတ်ဆက်စကား','နာမ်','ကြိယာ','သမ္ဗန္ဓ'],0)]},
{id:'m4-3',type:'grammar',title:['Adverbs (ကြိယာဝိသေသန)','ကြိယာဝိသေသန'],
 points:[
 [['An adverb (ကြိယာဝိသေသန) describes a verb: how, when or how often. It comes before the verb.','ကြိယာဝိသေသနက ကြိယာကို ဖော်ပြတယ်: ဘယ်လို၊ ဘယ်အချိန်၊ ဘယ်နှကြိမ်။ ကြိယာရှေ့မှာ လာတယ်။']],
 [['Doubling an adjective often makes an adverb: မြန် → မြန်မြန်, ဖြည်း → ဖြည်းဖြည်း, ကောင်း → ကောင်းကောင်း.','နာမဝိသေသနကို နှစ်ခါထပ်ပြီး ကြိယာဝိသေသန လုပ်လို့ရတယ်: မြန် → မြန်မြန်၊ ကောင်း → ကောင်းကောင်း။']]],
 table:{head:['Burmese','English','Kind'],rows:[['မြန်မြန်','quickly','manner'],['ဖြည်းဖြည်း','slowly','manner'],['အမြဲ','always','frequency'],['တစ်ခါတလေ','sometimes','frequency'],['ဒီနေ့','today','time']]},
 examples:[['သူ မြန်မြန် ပြေးတယ်။ (He runs quickly.)','သူ မြန်မြန် ပြေးတယ်။'],['ဖြည်းဖြည်း ပြောပါ။ (Please speak slowly.)','ဖြည်းဖြည်း ပြောပါ။']],
 quiz:[QM('"ဖြည်းဖြည်း" ရဲ့ အင်္ဂလိပ်ဘာသာ ...',['quickly','slowly','always','never'],1),QM('ကြိယာဝိသေသန ဘယ်မှာ လာလဲ။',['ကြိယာရှေ့','နာမ်ရှေ့','ဝါကျအဆုံးတွင်သာ','ကြိယာနောက်သာ'],0),QM('"အမြဲ" က ဘယ်အမျိုးအစားလဲ။',['အကြိမ်ရေ','အရောင်','နေရာ','ဂဏန်း'],0),QM('"မြန်" ကို နှစ်ခါထပ်ရင် ...',['မြန်မြန်','မြန်မြန်မြန်','မြန်မ','မြန်တယ်'],0)]}
]},
{id:'m5',title:['Particles, Conjunctions, Interjections','ဝိဘတ်၊ သမ္ဗန္ဓ၊ အာမေဍိတ်'],lessons:[
{id:'m5-1',type:'grammar',title:['Particles (ဝိဘတ်)','ဝိဘတ်'],
 points:[
 [['A particle (ဝိဘတ်) is attached to a noun to show its role in the sentence. Burmese uses particles where English uses word order and prepositions.','ဝိဘတ်က နာမ်နောက်မှာ ကပ်ပြီး ဝါကျထဲက အခန်းကဏ္ဍကို ပြတယ်။ အင်္ဂလိပ်မှာ ဝါကျအစီအစဉ်နဲ့ preposition သုံးတဲ့နေရာမှာ မြန်မာက ဝိဘတ်သုံးတယ်။']],
 [['က / သည် marks the subject; ကို marks the object; မှာ / တွင် = at / in; မှ = from; သို့ = to; နှင့် = with / and; ၏ = of.','က/သည် = ကတ္တား၊ ကို = ကံ၊ မှာ/တွင် = နေရာ၊ မှ = ကနေ၊ သို့ = ဆီသို့၊ နှင့် = နဲ့၊ ၏ = ရဲ့။']]],
 table:{head:['Particle','Role','Example'],rows:[['က / သည်','subject','ကလေးက စားတယ်'],['ကို','object','ပန်းသီးကို စားတယ်'],['မှာ / တွင်','place','အိမ်မှာ နေတယ်'],['မှ','from','ရန်ကုန်မှ လာတယ်'],['သို့','to','မန္တလေးသို့ သွားတယ်'],['နှင့်','with','သူငယ်ချင်းနှင့် သွားတယ်'],['၏','of','ကျွန်တော်၏ စာအုပ်']]},
 examples:[['ကျွန်တော်က စာအုပ်ကို ဖတ်တယ်။ (I read the book.)','ကျွန်တော်က စာအုပ်ကို ဖတ်တယ်။'],['သူသည် ရန်ကုန်မှ မန္တလေးသို့ သွားသည်။ (He goes from Yangon to Mandalay.)','သူသည် ရန်ကုန်မှ မန္တလေးသို့ သွားသည်။']],
 quiz:[QM('ကံ (object) ကို ပြတဲ့ ဝိဘတ်က ...',['က','ကို','မှာ','၏'],1),QM('"အိမ်___ နေတယ်" (အိမ်မှာ) - ဘယ်ဟာ ဖြည့်ရမလဲ။',['ကို','မှာ','က','ရဲ့'],1),QM('"၏" ရဲ့ အဓိပ္ပာယ်က ...',['from','of','with','to'],1),QM('"မှ" က ...',['to','from','of','and'],1)]},
{id:'m5-2',type:'grammar',title:['Conjunctions (သမ္ဗန္ဓ)','သမ္ဗန္ဓ'],
 points:[
 [['A conjunction (သမ္ဗန္ဓ) joins words, phrases or clauses. It shows the link between ideas.','သမ္ဗန္ဓက စကားလုံး၊ စကားစု၊ ဝါကျတွေကို ဆက်စပ်ပေးတယ်။']],
 [['Addition: နှင့်၊ ပြီးတော့။ Contrast: ဒါပေမဲ့၊ သို့ရာတွင်။ Reason: ကြောင့်၊ ဒါကြောင့်။ Choice: သို့မဟုတ်။','ပေါင်းထည့်: နှင့်၊ ပြီးတော့။ ဆန့်ကျင်: ဒါပေမဲ့။ အကြောင်းအကျိုး: ကြောင့်၊ ဒါကြောင့်။ ရွေးချယ်: သို့မဟုတ်။']]],
 table:{head:['Burmese','English','Use'],rows:[['နှင့် / နဲ့','and / with','addition'],['ပြီးတော့','and then','sequence'],['ဒါပေမဲ့ / သို့ရာတွင်','but / however','contrast'],['ကြောင့်','because','reason'],['ဒါကြောင့်','therefore','result'],['သို့မဟုတ်','or','choice']]},

(function(){
'use strict';
var COURSES=[window.COURSE_GRAMMAR,window.COURSE_VOCAB,window.COURSE_SENT,window.COURSE_MY];
var $=function(s,r){return (r||document).querySelector(s)};
var $$=function(s,r){return Array.prototype.slice.call((r||document).querySelectorAll(s))};
var REDUCED=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- storage (safe) ---------- */
var mem={};
function sGet(k,d){try{var v=localStorage.getItem('le.'+k);return v==null?(k in mem?mem[k]:d):JSON.parse(v)}catch(e){return k in mem?mem[k]:d}}
function sSet(k,v){mem[k]=v;try{localStorage.setItem('le.'+k,JSON.stringify(v))}catch(e){}}

var S={lang:sGet('lang','en'),tr:sGet('tr',true),size:sGet('size','m'),theme:sGet('theme','auto'),name:sGet('name',''),
  prog:sGet('prog',{}),last:sGet('last',null),welcomed:sGet('welcomed',false)};

/* ---------- indexes ---------- */
var IDX={course:{},unit:{},lesson:{}};
COURSES.forEach(function(c){IDX.course[c.id]=c;c.units.forEach(function(u,ui){u.course=c;u.n=ui+1;IDX.unit[u.id]=u;
  u.lessons.forEach(function(l,li){l.unit=u;l.course=c;l.n=li+1;IDX.lesson[l.id]=l})})});
function coursesFor(lang){return COURSES.filter(function(c){return c.lang===lang})}
function allLessons(lang){var a=[];coursesFor(lang).forEach(function(c){c.units.forEach(function(u){u.lessons.forEach(function(l){a.push(l)})})});return a}
function flatLessons(){var a=[];COURSES.forEach(function(c){c.units.forEach(function(u){u.lessons.forEach(function(l){a.push(l)})})});return a}
function stat(id){return S.prog[id]||'todo'}
function unitProg(u){var d=u.lessons.filter(function(l){return stat(l.id)==='done'}).length;return {d:d,t:u.lessons.length,p:Math.round(d/u.lessons.length*100)}}
function courseProg(c){var d=0,t=0;c.units.forEach(function(u){var p=unitProg(u);d+=p.d;t+=p.t});return {d:d,t:t,p:t?Math.round(d/t*100):0}}
function langProg(){var d=0,t=0;coursesFor(S.lang).forEach(function(c){var p=courseProg(c);d+=p.d;t+=p.t});return {d:d,t:t,p:t?Math.round(d/t*100):0}}

/* ---------- helpers ---------- */
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function icon(n,cls){return '<svg class="i '+(cls||'')+'" aria-hidden="true"><use href="#i-'+n+'"/></svg>'}
function isMy(c){return c.lang==='my'}
/* pair = [English, Burmese]; returns main (language being learned) and sub (translation) */
function pr(p,course){
  if(isMy(course)){var m=p[0].match(/\(([^)]*)\)\s*$/);return {main:p[1],mainLang:'my',sub:m?m[1]:p[0],subLang:'en'}}
  return {main:p[0],mainLang:'en',sub:p[1],subLang:'my'}
}
function tx(p,course,cls){var r=pr(p,course);return '<div class="main" lang="'+r.mainLang+'">'+esc(r.main)+'</div>'+(r.sub?'<div class="tr '+(cls||'')+'" lang="'+r.subLang+'">'+esc(r.sub)+'</div>':'')}
function T(p,course){return isMy(course)?[p[1],p[0]]:[p[0],p[1]]} // [main, sub] for titles
function lvlPill(c){var m={Beginner:['beg','Beginner · အခြေခံ'],Intermediate:['int','Intermediate · အလယ်အလတ်']};var x=m[c.level]||['beg',c.level];return '<span class="pill '+x[0]+'"><i></i>'+x[1]+'</span>'}
function stPill(id){var s=stat(id);var t={todo:'To-do',doing:'In progress',done:'Done'}[s];return '<span class="pill '+s+'"><i></i>'+t+'</span>'}
function typePill(l){var t={grammar:'Grammar',vocab:'Vocabulary',sent:'Sentences',letters:'Letters'}[l.type];return '<span class="pill type"><i></i>'+t+'</span>'}
function toast(msg){var t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},2200)}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}
function speak(text,btn){try{var u=new SpeechSynthesisUtterance(text.replace(/___/g,'blank'));u.lang='en-US';u.rate=.88;speechSynthesis.cancel();
  if(btn){btn.classList.add('on');u.onend=u.onerror=function(){btn.classList.remove('on')}}speechSynthesis.speak(u)}catch(e){toast('Audio is not available in this browser')}}
function spk(text){return '<button type="button" class="spk" data-speak="'+esc(text)+'" aria-label="Listen: '+esc(text)+'">'+icon('sound')+'</button>'}

/* ---------- animations ---------- */
function animateHeight(el,open){
  if(REDUCED){el.hidden=!open;return}
  if(open){el.hidden=false;var h=el.scrollHeight;el.animate([{height:'0px',opacity:0},{height:h+'px',opacity:1}],{duration:320,easing:'cubic-bezier(.22,1,.36,1)'})}
  else{var h2=el.scrollHeight;var a=el.animate([{height:h2+'px',opacity:1},{height:'0px',opacity:0}],{duration:260,easing:'cubic-bezier(.4,0,.2,1)'});a.onfinish=function(){el.hidden=true}}
}
document.addEventListener('pointerdown',function(e){var b=e.target.closest&&e.target.closest('.btn,.ibtn,.choice,.tok');if(!b||REDUCED)return;
  var r=b.getBoundingClientRect(),d=Math.max(r.width,r.height),s=document.createElement('span');s.className='ripple';
  s.style.cssText='width:'+d+'px;height:'+d+'px;left:'+(e.clientX-r.left-d/2)+'px;top:'+(e.clientY-r.top-d/2)+'px';
  if(getComputedStyle(b).position==='static')b.style.position='relative';b.appendChild(s);setTimeout(function(){s.remove()},650)});

/* ---------- shell: sidebar ---------- */
var mobile=function(){return window.matchMedia('(max-width: 900px)').matches};
function setSide(open){
  document.body.classList.toggle('side-open',open&&mobile());
  document.body.classList.toggle('side-closed',!open);
  $('#menuBtn').setAttribute('aria-expanded',String(open));
  sSet('side',open);
}
function sideIsOpen(){return mobile()?document.body.classList.contains('side-open'):!document.body.classList.contains('side-closed')}
function initSide(){
  if(mobile())document.body.classList.add('side-closed');
  else if(sGet('side',true)===false)document.body.classList.add('side-closed');
  $('#menuBtn').setAttribute('aria-expanded',String(!document.body.classList.contains('side-closed')));
  $('#menuBtn').addEventListener('click',function(){
    if(mobile()){var o=!document.body.classList.contains('side-open');document.body.classList.toggle('side-open',o);document.body.classList.toggle('side-closed',!o);$('#menuBtn').setAttribute('aria-expanded',String(o))}
    else setSide(document.body.classList.contains('side-closed'))});
  $('#scrim').addEventListener('click',function(){document.body.classList.remove('side-open');document.body.classList.add('side-closed')});
  window.addEventListener('resize',function(){if(!mobile())document.body.classList.remove('side-open')});
}
function closeMobileSide(){if(mobile()){document.body.classList.remove('side-open');document.body.classList.add('side-closed');$('#menuBtn').setAttribute('aria-expanded','false')}}

/* ---------- nav tree (3 levels) ---------- */
var openSet={};
function renderNav(route){
  var h='<a class="l1" href="#home" '+(route.v==='home'?'aria-current="page"':'')+'><span class="ico">'+icon('home')+'</span>Home · ပင်မစာမျက်နှာ</a>';
  coursesFor(S.lang).forEach(function(c){
    var cid='c:'+c.id,isOpen=openSet[cid]!==undefined?openSet[cid]:(route.course===c.id);
    var t=T(c.title,c);
    h+='<div class="grp'+(isOpen?' open':'')+'" data-key="'+cid+'"><div style="display:flex;align-items:center;gap:2px"><a class="l1" style="flex:1" href="#c-'+c.id+'" '+(route.v==='course'&&route.course===c.id?'aria-current="page"':'')+'><span class="ico">'+icon(c.icon)+'</span><span lang="'+(isMy(c)?'my':'en')+'">'+esc(t[0])+'</span></a>'+
      '<button type="button" class="row" style="width:38px;padding:.55rem" data-toggle="'+cid+'" aria-expanded="'+isOpen+'" aria-label="Expand '+esc(c.title[0])+'">'+icon('chev','chev')+'</button></div>'+
      '<div class="sub" '+(isOpen?'':'hidden')+'>';
    c.units.forEach(function(u){
      var uid='u:'+u.id,uo=openSet[uid]!==undefined?openSet[uid]:(route.unit===u.id);var ut=T(u.title,c);var up=unitProg(u);
      h+='<div class="grp'+(uo?' open':'')+'" data-key="'+uid+'"><div style="display:flex;align-items:center;gap:2px"><a class="l2" style="flex:1" href="#u-'+u.id+'" '+(route.v==='unit'&&route.unit===u.id?'aria-current="page"':'')+'><span lang="'+(isMy(c)?'my':'en')+'">'+u.n+'. '+esc(ut[0])+'</span></a>'+
        '<button type="button" class="row" style="width:34px;padding:.5rem" data-toggle="'+uid+'" aria-expanded="'+uo+'" aria-label="Expand unit '+u.n+'">'+icon('chev','chev')+'</button></div>'+
        '<div class="sub" '+(uo?'':'hidden')+'>';
      u.lessons.forEach(function(l){var lt=T(l.title,c);
        h+='<a class="l3" href="#l-'+l.id+'" '+(route.v==='lesson'&&route.lesson===l.id?'aria-current="page"':'')+'><i class="dot '+stat(l.id)+'"></i><span lang="'+(isMy(c)?'my':'en')+'">'+esc(lt[0])+'</span></a>'});
      h+='</div></div>'});
    h+='</div></div>'});
  $('#nav').innerHTML=h;

    var tgt=$('#tgt',box),bk=$('#bank',box),fb=$('#fb',box);
    function draw(){tgt.innerHTML='';bk.innerHTML='';
      placed.forEach(function(t,k){var b=document.createElement('button');b.type='button';b.className='tok';b.textContent=t.w;b.onclick=function(){placed.splice(k,1);bank.push(t);draw()};tgt.appendChild(b)});
      bank.forEach(function(t,k){var b=document.createElement('button');b.type='button';b.className='tok';b.textContent=t.w;b.onclick=function(){bank.splice(k,1);placed.push(t);draw()};bk.appendChild(b)})}
    draw();
    $('#rst',box).onclick=function(){bank=shuffle(words.map(function(w,i){return {w:w,i:i}}));placed=[];tgt.className='tgt';fb.textContent='';draw()};
    $('#chk',box).onclick=function(){var ans=placed.map(function(t){return t.w}).join(' ')+punct;
      if(ans===s[0]){tgt.className='tgt ok';fb.style.color='var(--good)';fb.textContent='Correct!';
        if(idx<picks.length-1){setTimeout(function(){idx++;show()},900)}else{setTimeout(function(){box.innerHTML='<h3 style="font-family:var(--f-display)">Great job!</h3><p class="tr" style="margin:.4rem 0 1rem">You built all '+picks.length+' sentences.</p><button type="button" class="btn primary" id="again">Practise again</button>';
          $('#again',box).onclick=function(){initScramble(l)};markDone(l,true)},900)}}
      else{tgt.className='tgt bad';fb.style.color='var(--bad)';fb.textContent='Not yet. Tap a word to move it back, then try again.';setTimeout(function(){tgt.classList.remove('bad')},450)}};
    var bank2=bank;
  }
  show()}

function wire(r){
  if(r.v!=='lesson')return;
  var l=IDX.lesson[r.lesson],c=l.course;
  $('#doneBtn').onclick=function(){markDone(l,false)};
  if(l.type==='grammar'||l.type==='letters')renderQuiz(l.quiz,l,c);
  else if(l.type==='vocab')renderQuiz(makeVocabQuiz(l),l,c);
  else if(l.type==='sent')initScramble(l);
  if(l.type==='letters'){var det=$('#ldetail');
    $$('.tile').forEach(function(t){t.onclick=function(){$$('.tile').forEach(function(x){x.setAttribute('aria-pressed','false')});t.setAttribute('aria-pressed','true');
      det.innerHTML='<div class="big" lang="my">'+t.dataset.letter+'</div><div><b>'+t.dataset.sound+'</b><p><span lang="my">'+t.dataset.grp+'</span> · '+(t.dataset.letter)+'</p></div>';
      if(!REDUCED)det.animate([{transform:'scale(.97)'},{transform:'scale(1)'}],{duration:260,easing:'cubic-bezier(.34,1.56,.64,1)'})}})}
  $$('[data-peek]').forEach(function(b){b.onclick=function(){var t=b.parentNode.querySelector('.tr');t.style.setProperty('display','block','important');b.setAttribute('aria-expanded','true')}});
}

/* ---------- welcome ---------- */
function initWelcome(){
  var w=$('#welcome');
  function close(){w.classList.add('out');w.setAttribute('aria-hidden','true');S.welcomed=true;sSet('welcomed',true);setTimeout(function(){w.hidden=true},700);route()}
  if(S.welcomed){w.hidden=true;return false}
  var wl=S.lang;
  $$('#wLang button').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.lang===wl));b.onclick=function(){wl=b.dataset.lang;$$('#wLang button').forEach(function(x){x.setAttribute('aria-pressed',String(x===b))})}});
  $('#wForm').addEventListener('submit',function(e){e.preventDefault();var n=$('#wName').value.trim();S.name=n;sSet('name',n);S.lang=wl;sSet('lang',wl);applyLang();close()});
  $('#wSkip').onclick=function(){S.lang=wl;sSet('lang',wl);applyLang();close()};
  return true;
}

/* ---------- boot ---------- */
applyPrefs();applyLang();initSide();
var waiting=initWelcome();
route();
})();

</script>
